<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Gem Shape Viewer diagnostics</title>
<style>body{font:14px/1.5 system-ui,sans-serif;margin:24px;max-width:900px}pre{background:#f4f4f5;padding:12px;white-space:pre-wrap}.ok{color:#15803d}.bad{color:#b91c1c}</style></head>
<body>
<h1>Gem Shape Viewer diagnostics</h1>
<p>Each step runs in order. Send a screenshot of this page.</p>
<pre id="log">starting...</pre>
<canvas id="c" width="300" height="200" style="border:1px solid #ccc"></canvas>
<script>
const log = document.getElementById('log'); log.textContent = '';
const line = (msg, ok) => { const s = document.createElement('span'); s.className = ok === undefined ? '' : (ok ? 'ok' : 'bad'); s.textContent = msg + '\n'; log.appendChild(s); };
line('browser: ' + navigator.userAgent);
line('page URL: ' + location.href);
(async () => {
  const files = ['index.html', 'app/main.js', 'app/editor.js', 'app/underlay.js', 'app/views.js', 'app/gemcad/design.js', 'app/gemcad/polytope.js', 'app/gemcad/mesh.js',
    'app/gemcad/generators.js', 'app/gemcad/shapebuild.js', 'app/gemcad/fancy.js', 'app/gemcad/templates.js', 'app/gemcad/shapes/index.js',
    'vendor/three/three.module.js', 'vendor/three/lines/LineSegments2.js'];
  for (const f of files) {
    const t = performance.now();
    try { const r = await fetch(f, { cache: 'no-store' }); const b = await r.text(); line(`fetch ${f}: ${r.status}, ${b.length} chars, ${(performance.now() - t).toFixed(0)} ms`, r.ok); }
    catch (e) { line(`fetch ${f}: FAILED ${e}`, false); }
  }
  try {
    const t = performance.now();
    const THREE = await import('./vendor/three/three.module.js');
    line(`import three.module.js: ok (r${THREE.REVISION}), ${(performance.now() - t).toFixed(0)} ms`, true);
  } catch (e) { line('import three.module.js: FAILED ' + e, false); }
  // import each module on its own so a syntax error or a missing export names the file
  for (const m of ['app/gemcad/design.js', 'app/gemcad/polytope.js', 'app/gemcad/generators.js', 'app/gemcad/shapebuild.js', 'app/gemcad/fancy.js',
    'app/gemcad/shapes/marquise.js', 'app/gemcad/shapes/pear.js', 'app/gemcad/shapes/heart.js', 'app/gemcad/shapes/oval.js', 'app/gemcad/shapes/cushion.js',
    'app/gemcad/shapes/cushionModified.js', 'app/gemcad/shapes/princess.js', 'app/gemcad/shapes/radiant.js', 'app/gemcad/shapes/emerald.js', 'app/gemcad/shapes/asscher.js',
    'app/gemcad/shapes/index.js', 'app/gemcad/templates.js', 'app/gemcad/mesh.js', 'app/underlay.js', 'app/views.js']) {
    const t = performance.now();
    try { await import('./' + m); line(`import ${m}: ok, ${(performance.now() - t).toFixed(0)} ms`, true); }
    catch (e) { line(`import ${m}: FAILED ${e.message || e}`, false); }
  }
  try {
    const t = performance.now();
    const { templates } = await import('./app/gemcad/templates.js');
    const { designMesh } = await import('./app/gemcad/mesh.js');
    for (const [k, tpl] of Object.entries(templates)) {
      const t2 = performance.now();
      try { const m = designMesh(tpl.make()); line(`  build ${k}: ${m.faceCount} faces, ${(performance.now() - t2).toFixed(0)} ms`, true); }
      catch (e) { line(`  build ${k}: FAILED ${e.message || e}`, false); }
    }
    line(`all templates built in ${(performance.now() - t).toFixed(0)} ms`, true);
  } catch (e) { line('build templates: FAILED ' + (e.stack || e), false); }
  try {
    const canvas = document.getElementById('c');
    const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
    if (!gl) throw new Error('no WebGL context');
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    line('WebGL: ok, renderer ' + (dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)), true);
    gl.clearColor(0.2, 0.6, 0.3, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    line('the canvas below should be green', true);
  } catch (e) { line('WebGL: FAILED ' + e, false); }
  try {
    const t = performance.now();
    await import('./app/main.js?diag=1');
    line(`import app/main.js: ok, ${(performance.now() - t).toFixed(0)} ms (it will complain about missing UI elements; that is expected here)`, true);
  } catch (e) { line('import app/main.js: ' + (e.message || e) + ' (expected if it needs the real page)', undefined); }
  line('done');
})();
</script>
</body></html>
